<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Team Issue Finder</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --accent: #0969da;
      --accent-hover: #0757b5;
      --focus: #54aeff;
      --success: #1a7f37;
      --shadow: 0 8px 28px rgba(31, 35, 40, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --accent: #2f81f7;
        --accent-hover: #58a6ff;
        --focus: #58a6ff;
        --success: #3fb950;
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 44px;
      border-radius: 7px;
      font: inherit;
    }

    input,
    select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 1px;
      border-color: var(--focus);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 26px;
    }

    button {
      padding: 10px 16px;
      border: 1px solid var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    button[type="submit"] {
      background: var(--accent);
      color: #fff;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }

    button[type="button"] {
      background: transparent;
      color: var(--accent);
    }

    button[type="button"]:hover {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--success);
      text-align: center;
    }

    details {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    summary { cursor: pointer; }
    ul { padding-left: 22px; }

    @media (max-width: 480px) {
      .buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Issue Finder</h1>
    <p class="intro">Find issues with the same label across all four Chatbar repositories.</p>

    <form id="issue-search">
      <div class="field">
        <label for="label">Issue label</label>
        <input
          id="label"
          name="label"
          list="label-suggestions"
          placeholder="Start typing or choose a label"
          autocomplete="off"
          required
          autofocus
        >
        <datalist id="label-suggestions"></datalist>
      </div>

      <div class="field">
        <label for="state">Issue state</label>
        <select id="state" name="state">
          <option value="open" selected>Open</option>
          <option value="closed">Closed</option>
          <option value="all">Open and closed</option>
        </select>
      </div>

      <div class="buttons">
        <button type="submit">Open in GitHub</button>
        <button type="button" id="copy-link">Copy link</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <details>
      <summary>Repositories included</summary>
      <ul id="repository-list"></ul>
    </details>
  </main>

  <script>
    // Edit this list if repositories are added, removed, or renamed.
    const repositories = [
      "brodjustice/chatbar-ai-search-fullstack",
      "brodjustice/ai_search",
      "brodjustice/chatbar_lms",
      "brodjustice/Chatbar-AI-Pte-Issue-Tracker"
    ];

    // Replace these examples with your team's labels. Users can still type
    // any label that is not included here.
    const suggestedLabels = [
      "bug",
      "documentation",
      "duplicate",
      "enhancement",
      "good first issue",
      "help wanted",
      "invalid",
      "question",
      "wontfix"
    ];

    const form = document.querySelector("#issue-search");
    const labelInput = document.querySelector("#label");
    const stateSelect = document.querySelector("#state");
    const copyButton = document.querySelector("#copy-link");
    const statusMessage = document.querySelector("#status");

    for (const label of suggestedLabels) {
      const option = document.createElement("option");
      option.value = label;
      document.querySelector("#label-suggestions").append(option);
    }

    for (const repository of repositories) {
      const item = document.createElement("li");
      item.textContent = repository;
      document.querySelector("#repository-list").append(item);
    }

    function buildGitHubUrl() {
      const label = labelInput.value.trim();
      if (!label) {
        labelInput.reportValidity();
        return null;
      }

      const repositoryQuery = repositories
        .map(repository => `repo:${repository}`)
        .join(" OR ");

      const stateQuery = stateSelect.value === "all"
        ? ""
        : ` state:${stateSelect.value}`;

      // Escaping quotes and backslashes keeps a typed label inside the
      // label qualifier rather than allowing it to alter the search query.
      const safeLabel = label.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      const query = `is:issue${stateQuery} (${repositoryQuery}) label:"${safeLabel}"`;

      return `https://github.com/issues?q=${encodeURIComponent(query)}`;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const url = buildGitHubUrl();
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });

    copyButton.addEventListener("click", async () => {
      const url = buildGitHubUrl();
      if (!url) return;

      try {
        await navigator.clipboard.writeText(url);
        statusMessage.textContent = "Link copied to clipboard.";
      } catch {
        window.prompt("Copy this link:", url);
        statusMessage.textContent = "Your browser opened a manual copy prompt.";
      }

      window.setTimeout(() => {
        statusMessage.textContent = "";
      }, 3000);
    });
  </script>
</body>
</html>
